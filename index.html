<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Grid</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>Tim Burton</h1>
        <h3>Merchandise</h3>
    </header>
    <nav>
        <h3>Categorías</h3>
        <p><b>Figuras</b> (3)</b></p>
        <p><b>Libros</b> (1)</b></p>
        <p><b>Tarjetas</b> (2)</b></p>
    </nav>
    <main>
        <div class="card">
            <img src="https://images.squarespace-cdn.com/content/v1/5409d847e4b0dacce665984c/1415657856070-BODQGE1ORQO2BTTKBUQS/image_01.png?format=2500w" alt="set de tarjetas">
            <h4>Set de Tarjetas Navideñas</h4>
            <p>$10.000</p>
            <button>Comprar</button>
        </div>
        <div class="card">
            <img src="https://images.squarespace-cdn.com/content/v1/614e3bbd834f30716574241e/1638887692399-GTTXUOCF3UP12XNOX50I/smlTB_napkin+cover.jpg">
            <h4>The art of Tim Burton</h4>
            <p>$25.000</p>
            <button>Comprar</button>
        </div>
        <div class="card">
            <img src="https://i.ebayimg.com/images/g/~00AAOSw-qtlu6Ek/s-l1200.jpg" alt="Figuras de Corpse Bride">
            <h4>Figuras de Corpse Bride</h4>
            <p>$15.000</p>
            <button>Comprar</button>
        </div>
        <div class="card">
            <img src="https://yvolve.shop/cdn/shop/files/NBC-0103-NBC-0102.png?v=1770365316&width=533" alt="Figuras de Nightmare Before Christmas">
            <h4>Figuras de Nightmare Before Christmas</h4>
            <p>$20.000</p>
            <button>Comprar</button>
        </div>
    </main>
    <footer>
        <p>@TimBurton</p>
    </footer>
</body>
</html>
